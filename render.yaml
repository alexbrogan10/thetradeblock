# Render Blueprint (https://render.com/docs/blueprint-spec).
#
# Deploys The Trade Block as three services on Render: a managed
# PostgreSQL database, the FastAPI backend, and the static-built React
# frontend. This mirrors docker-compose.yml's three services; it does
# not add anything docker-compose.yml doesn't already have.
#
# After the first deploy, run the data pipeline once via the Render
# shell on the backend service (or a one-off Job):
#   python scripts/generate_demo_data.py && python scripts/seed_demo_data.py
# (models/player_performance_projection_v1.joblib is already committed,
# so scripts/train_performance_projection.py is only needed after
# re-seeding with different data.)
databases:
  - name: trade-block-db
    plan: free
    databaseName: tradeblock
    user: tradeblock

services:
  - type: web
    name: trade-block-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trade-block-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      # MODEL_DIR is left at its default ("../models"): Render checks out
      # the full repo and runs commands from rootDir, so the relative
      # path already resolves to <repo>/models without an override
      # (unlike the Docker Compose backend service, whose build context
      # is backend/ alone -- see docker-compose.yml).

  - type: web
    name: trade-block-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://trade-block-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
