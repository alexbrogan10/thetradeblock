services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradeblock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradeblock}
      POSTGRES_DB: ${POSTGRES_DB:-tradeblock}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradeblock}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://tradeblock:tradeblock@db:5432/tradeblock}
      APP_ENV: ${APP_ENV:-development}
      DEMO_MODE: ${DEMO_MODE:-true}
      MODEL_DIR: /models
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./models:/models
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # One-off data loader. Run explicitly with:
  #   docker compose run --rm seed
  seed:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://tradeblock:tradeblock@db:5432/tradeblock}
    volumes:
      - ./:/workspace
    working_dir: /workspace
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]
    command: python scripts/seed_demo_data.py

  # One-off ML training job (Section 38-39). Run explicitly with:
  #   docker compose run --rm train
  # Writes models/player_performance_projection_v1.joblib, which the
  # backend service picks up from the shared ./models mount on its next
  # request (no restart needed).
  train:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://tradeblock:tradeblock@db:5432/tradeblock}
    volumes:
      - ./:/workspace
    working_dir: /workspace
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]
    command: python scripts/train_performance_projection.py

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
